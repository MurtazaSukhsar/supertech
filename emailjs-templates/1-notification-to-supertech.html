<!--
  EmailJS Template 1 of 2 — NOTIFICATION TO SUPER TECH
  Paste this into: EmailJS -> Email Templates -> your template -> "Code Editor" (</> icon)

  SETTINGS TAB — set these fields exactly:
    Subject    : New enquiry: {{subject}} — {{from_name}}
    To Email   : supertechcm@gmail.com
    From Name  : Super Tech Website
    Reply To   : {{reply_to}}          <-- important, lets you reply straight to the customer

  Do NOT put {{from_email}} in the "From Email" field. Gmail will reject it
  (SPF/DKIM failure) because your server isn't authorised to send as that domain.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0;padding:0;background-color:#f2f4f8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;">
  <tr>
    <td align="center" style="padding:24px 12px;">

      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:100%;max-width:600px;background-color:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e2e6ee;">

        <!-- Header -->
        <tr>
          <td style="background-color:#0a2472;padding:28px 32px 24px 32px;">
            <p style="margin:0;font-size:19px;line-height:1.3;font-weight:700;color:#ffffff;">
              Super Tech International
            </p>
            <p style="margin:6px 0 0 0;font-size:13px;line-height:1.4;color:#a9b6d8;">
              New enquiry from the website contact form
            </p>
          </td>
        </tr>

        <!-- Red accent rule -->
        <tr><td style="height:4px;background-color:#D91E2A;font-size:0;line-height:0;">&nbsp;</td></tr>

        <!-- Subject line -->
        <tr>
          <td style="padding:28px 32px 0 32px;">
            <p style="margin:0 0 4px 0;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#7a879f;">
              Subject
            </p>
            <p style="margin:0;font-size:17px;line-height:1.4;font-weight:600;color:#0a2472;">
              {{subject}}
            </p>
          </td>
        </tr>

        <!-- Contact details -->
        <tr>
          <td style="padding:24px 32px 0 32px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;border-top:1px solid #e2e6ee;">
              <tr>
                <td width="120" style="padding:13px 0;font-size:13px;color:#7a879f;border-bottom:1px solid #eef1f6;vertical-align:top;">Name</td>
                <td style="padding:13px 0;font-size:14px;font-weight:600;color:#131a2b;border-bottom:1px solid #eef1f6;">{{from_name}}</td>
              </tr>
              <tr>
                <td style="padding:13px 0;font-size:13px;color:#7a879f;border-bottom:1px solid #eef1f6;vertical-align:top;">Email</td>
                <td style="padding:13px 0;font-size:14px;font-weight:600;border-bottom:1px solid #eef1f6;">
                  <a href="mailto:{{from_email}}" style="color:#D91E2A;text-decoration:none;">{{from_email}}</a>
                </td>
              </tr>
              <tr>
                <td style="padding:13px 0;font-size:13px;color:#7a879f;border-bottom:1px solid #eef1f6;vertical-align:top;">Phone</td>
                <td style="padding:13px 0;font-size:14px;font-weight:600;border-bottom:1px solid #eef1f6;">
                  <a href="tel:{{phone}}" style="color:#131a2b;text-decoration:none;">{{phone}}</a>
                </td>
              </tr>
              <tr>
                <td style="padding:13px 0;font-size:13px;color:#7a879f;vertical-align:top;">Received</td>
                <td style="padding:13px 0;font-size:14px;color:#131a2b;">{{sent_at}}</td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Message body -->
        <tr>
          <td style="padding:26px 32px 0 32px;">
            <p style="margin:0 0 10px 0;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#7a879f;">
              Message
            </p>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td style="background-color:#f7f9fc;border:1px solid #e2e6ee;border-left:3px solid #D91E2A;border-radius:6px;padding:18px 20px;">
                  <div style="margin:0;font-size:14px;line-height:1.7;color:#131a2b;white-space:pre-wrap;">{{message}}</div>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Reply button -->
        <tr>
          <td style="padding:26px 32px 32px 32px;">
            <table role="presentation" cellpadding="0" cellspacing="0">
              <tr>
                <td style="background-color:#D91E2A;border-radius:6px;">
                  <a href="mailto:{{from_email}}?subject=RE:%20{{subject}}"
                     style="display:inline-block;padding:13px 30px;font-size:14px;font-weight:700;color:#ffffff;text-decoration:none;">
                    Reply to {{from_name}}
                  </a>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td style="background-color:#f7f9fc;border-top:1px solid #e2e6ee;padding:18px 32px;">
            <p style="margin:0;font-size:11px;line-height:1.6;color:#8b96ab;">
              Sent automatically from the contact form at supertechkw.com
            </p>
          </td>
        </tr>

      </table>

    </td>
  </tr>
</table>
